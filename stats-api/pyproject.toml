[project]
name = "stats-api"
version = "0.1.0"
description = "API for the usage stats page on arxiv.org"
requires-python = "~=3.13.0"
dependencies = [
    "flask>=3.1.2,<4",
    "flask-cors>=6.0.5,<7",
    "flask-sqlalchemy>=3.1.1,<4",
    "gunicorn>=25.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymysql[rsa]>=1.2.0",
    "pytest>=8.4.2",
    "python-dateutil>=2.9.0.post0",
    "stats-entities",
    "arxiv-brand-templates",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
    "ruff>=0.15.20,<0.17",
    "ty>=0.0.56",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
stats-entities = { path = "../stats-entities", editable = true }
# The shared head/header/footer from the design system; uv.lock pins the SHA. Tracks the
# design-system PR branch (arXiv/design-system#6) until it merges, then master.
arxiv-brand-templates = { git = "https://github.com/arXiv/design-system.git", branch = "brand-templates-pr", subdirectory = "templates" }

[tool.ruff.lint]
ignore = [
    "DTZ001", # datetime() without tzinfo
    "DTZ005", # datetime.now() without tz
    "DTZ007", # strptime() without %z
    "B006",   # mutable argument default
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
